[project]
name = "docrot"
version = "0.1.0"
description = "Documentation rot detector - executes docs against real code across releases"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mistune>=3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "packaging>=24.0",
    "tenacity>=8.3",
    "rich>=13.7",
    "neo4j>=5.20",
    "trafilatura>=1.9",
    "openai>=1.30",
    "daytona>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[project.scripts]
docrot = "docrot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not neo4j' --strict-markers"
markers = [
    "e2e: drives the dashboard in a real browser (needs `playwright install chromium`)",
    "neo4j: needs the local Neo4j from docker-compose.yml, and wipes its graph",
]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.coverage.run]
source = ["docrot"]
omit = ["docrot/verify/runner.py"]   # drives Daytona; exercised by real scans

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101",    # assert is how pytest works
    "S110",    # best-effort cleanup (sandbox delete, git probe) is deliberately silent
    "SIM105",  # try/except/pass reads as clearly as contextlib.suppress here
    "S603", "S607",  # git is invoked with fixed argv, never a shell
    "SIM108",  # conditional expressions are not always clearer
    "SIM114",  # parallel isinstance branches stay separate for readability
    "RUF001", "RUF002", "RUF003",  # ·, —, … and ✗ are deliberate in UI strings
    "E501",    # long strings in probes and reports read better unwrapped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
files = ["docrot"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
