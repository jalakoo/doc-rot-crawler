name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # Mondays, for the dependency audit

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks reads the history, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose

  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v7

      - name: install
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          npm ci

      - name: install the browser the e2e tests drive
        run: .venv/bin/python -m playwright install --with-deps chromium

      # ruff + eslint, mypy, pytest (unit, API, Playwright) with coverage, node:test.
      # The Neo4j-backed tests are deselected by default: they need the database
      # from docker-compose.yml, and they wipe its graph.
      - name: make check
        run: make check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Advisories land on their own schedule, so this runs weekly rather than
    # failing an unrelated pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          npm ci
      - run: make audit
